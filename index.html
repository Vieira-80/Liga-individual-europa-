<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<title>Liga Individual Europa</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
body {
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:white;
  padding:20px;
}

h1 { text-align:center; margin-bottom:30px; }

h2 {
  margin-top:40px;
  border-bottom:2px solid #334155;
  padding-bottom:5px;
}

h3 { margin-top:20px; color:#cbd5f5; }

table {
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
  background:#1e293b;
  border-radius:10px;
  overflow:hidden;
}

td, th { padding:12px; text-align:center; }

tr { border-bottom:1px solid #334155; }
tr:last-child { border-bottom:none; }

input {
  width:45px;
  padding:6px;
  text-align:center;
  border-radius:6px;
  border:none;
  background:#020617;
  color:white;
  font-weight:bold;
}

td.primeira { background:#065f46; }
td.segunda { background:#7f1d1d; }

.primeira { background:#064e3b; }
.segunda { background:#7f1d1d; }

.linha-apuramento {
  border-bottom:3px solid #facc15 !important;
}

#login {
  text-align:center;
  margin-bottom:30px;
}

button {
  padding:6px 12px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

button:hover { background:#1d4ed8; }
</style></head><body><h1>LIGA INDIVIDUAL EUROPA</h1><div id="login">
<h3>Modo operador</h3>
<input type="password" id="pass" placeholder="Código">
<button onclick="login()">Entrar</button>
</div><div id="app"></div><script>

// 🔐 PASSWORD
const PASSWORD = "1234";
let editavel = false;

function login(){
  if(document.getElementById("pass").value === PASSWORD){
    editavel = true;
    document.getElementById("login").style.display="none";
    criar();
  } else {
    alert("Código errado");
  }
}

// 🔥 FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAjGPkHEc1-srjVvI8rhfhsTP-prs0jNUE",
  authDomain: "liga-individual-europa.firebaseapp.com",
  databaseURL: "https://liga-individual-europa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liga-individual-europa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 DADOS
const grupos = {
  grupoA:["Maga","Gil","Monteiro","F. Carvalho","Rui","M. Alves","Diogo"],
  grupoB:["Carrico","Europa","Osório","Fábio","Bezelga","Igor","Sousa"],
  grupoC:["N. Vieira","Jorge António","Quim Zé","Cenário","Queirós","P. Jorge","Cristian"]
};

const jornadas = [
 [[2,1],[3,7],[4,6]],
 [[1,3],[7,4],[6,5]],
 [[4,1],[3,2],[5,7]],
 [[1,5],[2,4],[7,6]],
 [[6,1],[5,2],[4,3]],
 [[1,7],[2,6],[3,5]],
 [[7,2],[6,3],[5,4]]
];

// 🔥 UI
function criar(){

  let html="";

  Object.keys(grupos).forEach(id=>{
    html+=`<h2>${id.toUpperCase()}</h2>`;

    jornadas.forEach((jornada,j)=>{
      html+=`<h3>Jornada ${j+1}</h3><table>`;

      jornada.forEach((jogo,i)=>{
        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a = Number(document.querySelector(`[data-id="${id}-${j}-${i}-1"]`)?.value) || 0;
        let b = Number(document.querySelector(`[data-id="${id}-${j}-${i}-2"]`)?.value) || 0;

        let classe1 = "";
        let classe2 = "";

        if(a > b){
          classe1 = "primeira";
          classe2 = "segunda";
        } else if(b > a){
          classe2 = "primeira";
          classe1 = "segunda";
        }

        html+=`
        <tr>
          <td class="${classe1}"><strong>${p1}</strong></td>
          <td>
            <input ${editavel?"":"disabled"} data-id="${id}-${j}-${i}-1" onchange="guardar(this)">
            -
            <input ${editavel?"":"disabled"} data-id="${id}-${j}-${i}-2" onchange="guardar(this)">
          </td>
          <td class="${classe2}"><strong>${p2}</strong></td>
        </tr>`;
      });

      html+="</table>";
    });

    html+=`<h3>Classificação</h3>
    <table id="class-${id}">
    <tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th><th>Forma</th></tr>
    </table>`;
  });

  document.getElementById("app").innerHTML=html;
}

// 🔥 GUARDAR
function guardar(input){
  db.ref("resultados/"+input.dataset.id).set(input.value);
}

// 🔥 REALTIME
db.ref("resultados").on("value", snap=>{
  let dados=snap.val()||{};

  document.querySelectorAll("input").forEach(inp=>{
    let val=dados[inp.dataset.id];
    if(val!==undefined) inp.value=val;
  });

  calcular();
});

// 🔥 CALCULAR
function calcular(){

  Object.keys(grupos).forEach(id=>{
    let stats={}, confrontos={};

    grupos[id].forEach(j=>{
      stats[j]={pg:0,pp:0};
      confrontos[j]={};
    });

    jornadas.forEach((jornada,j)=>{
      jornada.forEach((jogo,i)=>{
        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a=document.querySelector(`[data-id="${id}-${j}-${i}-1"]`);
        let b=document.querySelector(`[data-id="${id}-${j}-${i}-2"]`);

        let va=Number(a?.value)||0;
        let vb=Number(b?.value)||0;

        stats[p1].pg+=va;
        stats[p1].pp+=vb;
        stats[p2].pg+=vb;
        stats[p2].pp+=va;

        confrontos[p1][p2]=va-vb;
        confrontos[p2][p1]=vb-va;
      });
    });

    let lista=grupos[id].map(j=>({
      nome:j,
      pg:stats[j].pg,
      pp:stats[j].pp,
      pts:stats[j].pg,
      diff:stats[j].pg - stats[j].pp
    }));

    lista.sort((a,b)=>{
      if(b.pts !== a.pts) return b.pts - a.pts;
      if(b.diff !== a.diff) return b.diff - a.diff;
      let cd = confrontos[a.nome]?.[b.nome] || 0;
      return -cd;
    });

    let tabela=document.getElementById("class-"+id);
    tabela.innerHTML=`<tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th><th>Forma</th></tr>`;

    lista.forEach((j,idx)=>{
      let classe=idx<4?"primeira":"segunda";
      let linhaExtra = idx === 3 ? "linha-apuramento" : "";

      tabela.innerHTML+=`
      <tr class="${classe} ${linhaExtra}">
        <td>${idx+1}</td>
        <td>${j.nome}</td>
        <td>${j.pg}</td>
        <td>${j.pp}</td>
        <td>${j.pts}</td>
        <td id="forma-${id}-${j.nome}">-</td>
      </tr>`;
    });

    atualizarForma(id);
  });

  // atualizar cores jogos
  setTimeout(criar, 100);
}

// 🔥 FORMA
function atualizarForma(id){

  grupos[id].forEach(jogador=>{
    let resultados=[];

    jornadas.forEach((jornada,j)=>{
      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a=document.querySelector(`[data-id="${id}-${j}-${i}-1"]`);
        let b=document.querySelector(`[data-id="${id}-${j}-${i}-2"]`);

        let va=Number(a?.value)||0;
        let vb=Number(b?.value)||0;

        if(p1===jogador){
          if(va>vb) resultados.push("V");
          else if(vb>va) resultados.push("D");
        }

        if(p2===jogador){
          if(vb>va) resultados.push("V");
          else if(va>vb) resultados.push("D");
        }

      });
    });

    let ultimos = resultados.slice(-5).map(r=>{
      return r==="V" ? "🟢" : "🔴";
    }).join("");

    document.getElementById(`forma-${id}-${jogador}`).innerHTML = ultimos || "-";
  });
}

// 🔥 START
window.onload = () => {
  criar();
};

</script></body>
</html>
