<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<title>Liga Individual Europa</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
body {
  font-family: 'Segoe UI', Arial;
  background:#020617;
  color:white;
  margin:0;
  padding:15px;
}

h1 {
  text-align:center;
  margin-bottom:20px;
}

.card {
  background:#0f172a;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

h2 {
  margin-bottom:10px;
  border-bottom:1px solid #1e293b;
  padding-bottom:5px;
}

.jornada {
  margin-top:15px;
}

.jogo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#020617;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.jogador {
  width:40%;
  text-align:center;
  font-weight:bold;
}

.resultado {
  display:flex;
  align-items:center;
  gap:5px;
}

input {
  width:40px;
  padding:5px;
  text-align:center;
  border-radius:6px;
  border:none;
  background:#1e293b;
  color:white;
  font-weight:bold;
}

.vencedor { color:#22c55e; }
.derrotado { color:#ef4444; }

.tabela {
  margin-top:10px;
}

.tabela table {
  width:100%;
  border-collapse:collapse;
}

.tabela th, .tabela td {
  padding:8px;
  text-align:center;
}

.top4 { background:#064e3b; }
.ultimos { background:#7f1d1d; }

.linha {
  border-bottom:2px solid #facc15;
}

#login {
  text-align:center;
  margin-bottom:15px;
}

button {
  background:#2563eb;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  color:white;
  cursor:pointer;
}
</style></head><body><h1>LIGA INDIVIDUAL EUROPA</h1><div id="login">
<input type="password" id="pass" placeholder="Código operador">
<button onclick="login()">Entrar</button>
</div><div id="app"></div><script>

// 🔐 PASSWORD
const PASSWORD = "1234";
let editavel = false;

function login(){
  if(document.getElementById("pass").value === PASSWORD){
    editavel = true;
    document.getElementById("login").style.display="none";
    aplicarPermissoes();
  } else {
    alert("Código errado");
  }
}

// 🔥 FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAjGPkHEc1-srjVvI8rhfhsTP-prs0jNUE",
  authDomain: "liga-individual-europa.firebaseapp.com",
  databaseURL: "https://liga-individual-europa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liga-individual-europa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 DADOS
const grupos = {
  grupoA:["Maga","Gil","Monteiro","F. Carvalho","Rui","M. Alves","Diogo"],
  grupoB:["Carriço","Europa","Osório","Fábio","Bezelga","Igor","Sousa"],
  grupoC:["N. Vieira","Jorge António","Quim Zé","Cenário","Queirós","P. Jorge","Cristian"]
};

const jornadas = [
 [[2,1],[3,7],[4,6]],
 [[1,3],[7,4],[6,5]],
 [[4,1],[3,2],[5,7]],
 [[1,5],[2,4],[7,6]],
 [[6,1],[5,2],[4,3]],
 [[1,7],[2,6],[3,5]],
 [[7,2],[6,3],[5,4]]
];

// 🔥 UI
function criar(){

  let html="";

  Object.keys(grupos).forEach(id=>{

    html+=`<div class="card"><h2>${id.toUpperCase()}</h2>`;

    jornadas.forEach((jornada,j)=>{

      html+=`<div class="jornada"><h3>Jornada ${j+1}</h3>`;

      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a = Number(document.querySelector(`[data-id="${id}-${j}-${i}-1"]`)?.value)||0;
        let b = Number(document.querySelector(`[data-id="${id}-${j}-${i}-2"]`)?.value)||0;

        let c1="", c2="";
        if(a>b){ c1="vencedor"; c2="derrotado"; }
        else if(b>a){ c2="vencedor"; c1="derrotado"; }

        html+=`
        <div class="jogo">
          <div class="jogador ${c1}">${p1}</div>
          <div class="resultado">
            <input data-id="${id}-${j}-${i}-1">
            -
            <input data-id="${id}-${j}-${i}-2">
          </div>
          <div class="jogador ${c2}">${p2}</div>
        </div>`;
      });

      html+=`</div>`;
    });

    html+=`<div class="tabela">
    <table id="class-${id}">
    <tr><th>#</th><th>Jogador</th><th>Pts</th><th>Forma</th></tr>
    </table></div></div>`;
  });

  document.getElementById("app").innerHTML=html;
}

// 🔥 GUARDAR
function guardar(){
  if(!editavel) return;

  let dados={};
  document.querySelectorAll("input").forEach(i=>{
    dados[i.dataset.id]=i.value;
  });

  db.ref("resultados").set(dados);
}

// 🔥 LOAD
db.ref("resultados").on("value", snap=>{
  let dados=snap.val()||{};

  document.querySelectorAll("input").forEach(i=>{
    i.value=dados[i.dataset.id]||"";
    i.oninput=guardar;
  });

  calcular();
  aplicarPermissoes();
});

// 🔥 PERMISSÕES
function aplicarPermissoes(){
  document.querySelectorAll("input").forEach(i=>{
    i.disabled=!editavel;
  });
}

// 🔥 CALCULAR
function calcular(){

  Object.keys(grupos).forEach(id=>{
    let stats={}, hist={};

    grupos[id].forEach(j=>{
      stats[j]={pg:0,pp:0};
      hist[j]=[];
    });

    jornadas.forEach((jornada,j)=>{
      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a=document.querySelector(`[data-id="${id}-${j}-${i}-1"]`);
        let b=document.querySelector(`[data-id="${id}-${j}-${i}-2"]`);

        let va=Number(a?.value)||0;
        let vb=Number(b?.value)||0;

        stats[p1].pg+=va;
        stats[p1].pp+=vb;
        stats[p2].pg+=vb;
        stats[p2].pp+=va;

        if(va>vb){ hist[p1].push("🟢"); hist[p2].push("🔴"); }
        else if(vb>va){ hist[p2].push("🟢"); hist[p1].push("🔴"); }
      });
    });

    let lista=grupos[id].map(j=>({
      nome:j,
      pts:stats[j].pg,
      forma:hist[j].slice(-5).join("")
    }));

    lista.sort((a,b)=>b.pts-a.pts);

    let t=document.getElementById("class-"+id);
    t.innerHTML="<tr><th>#</th><th>Jogador</th><th>Pts</th><th>Forma</th></tr>";

    lista.forEach((j,idx)=>{
      let classe = idx<4?"top4":"ultimos";
      let linha = idx===3?"linha":"";

      t.innerHTML+=`
      <tr class="${classe} ${linha}">
        <td>${idx+1}</td>
        <td>${j.nome}</td>
        <td>${j.pts}</td>
        <td>${j.forma}</td>
      </tr>`;
    });

  });

  setTimeout(criar,100);
}

// 🔥 START
window.onload=criar;

</script></body>
</html>
