<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<title>Liga Individual Europa</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
body {
  font-family: Arial;
  background:#0f172a;
  color:white;
  padding:20px;
}

h1 { text-align:center; }

h2 { margin-top:40px; }

table {
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
  background:#1e293b;
}

td, th {
  padding:8px;
  text-align:center;
  border:1px solid #334155;
}

input {
  width:40px;
  text-align:center;
}

.primeira { background:#065f46; }
.segunda { background:#7f1d1d; }
.linha { border-bottom:3px solid yellow; }

</style></head><body><h1>LIGA INDIVIDUAL EUROPA</h1><div id="app"></div><script>

// 🔥 FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAjGPkHEc1-srjVvI8rhfhsTP-prs0jNUE",
  authDomain: "liga-individual-europa.firebaseapp.com",
  databaseURL: "https://liga-individual-europa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liga-individual-europa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 DADOS
const grupos = {
  grupoA:["Maga","Gil","Monteiro","F. Carvalho","Rui","M. Alves","Diogo"],
  grupoB:["Carrico","Europa","Osório","Fábio","Bezelga","Igor","Sousa"],
  grupoC:["N. Vieira","Jorge António","Quim Zé","Cenário","Queirós","P. Jorge","Cristian"]
};

const jornadas = [
 [[2,1],[3,7],[4,6]],
 [[1,3],[7,4],[6,5]],
 [[4,1],[3,2],[5,7]],
 [[1,5],[2,4],[7,6]],
 [[6,1],[5,2],[4,3]],
 [[1,7],[2,6],[3,5]],
 [[7,2],[6,3],[5,4]]
];

// 🔥 UI
function criar(){

  let html="";

  Object.keys(grupos).forEach(id=>{
    html+=`<h2>${id}</h2>`;

    jornadas.forEach((jornada,j)=>{
      html+=`<h3>Jornada ${j+1}</h3><table>`;

      jornada.forEach((jogo,i)=>{
        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        html+=`
        <tr>
          <td>${p1}</td>
          <td>
            <input data-id="${id}-${j}-${i}-1">
            -
            <input data-id="${id}-${j}-${i}-2">
          </td>
          <td>${p2}</td>
        </tr>`;
      });

      html+="</table>";
    });

    html+=`<h3>Classificação</h3>
    <table id="class-${id}">
    <tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th></tr>
    </table>`;
  });

  document.getElementById("app").innerHTML=html;
}

// 🔥 GUARDAR
function guardar(){
  let dados={};

  document.querySelectorAll("input").forEach(inp=>{
    dados[inp.dataset.id]=inp.value;
  });

  db.ref("resultados").set(dados);
}

// 🔥 CARREGAR
db.ref("resultados").on("value", snap=>{
  let dados=snap.val()||{};

  document.querySelectorAll("input").forEach(inp=>{
    inp.value = dados[inp.dataset.id] || "";
    inp.oninput = guardar;
  });

  calcular();
});

// 🔥 CALCULAR
function calcular(){

  Object.keys(grupos).forEach(id=>{
    let stats={};

    grupos[id].forEach(j=>{
      stats[j]={pg:0,pp:0};
    });

    jornadas.forEach((jornada,j)=>{
      jornada.forEach((jogo,i)=>{
        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a=document.querySelector(`[data-id="${id}-${j}-${i}-1"]`);
        let b=document.querySelector(`[data-id="${id}-${j}-${i}-2"]`);

        let va=Number(a?.value)||0;
        let vb=Number(b?.value)||0;

        stats[p1].pg+=va;
        stats[p1].pp+=vb;
        stats[p2].pg+=vb;
        stats[p2].pp+=va;
      });
    });

    let lista=grupos[id].map(j=>({
      nome:j,
      pg:stats[j].pg,
      pp:stats[j].pp,
      pts:stats[j].pg
    }));

    lista.sort((a,b)=>b.pts-a.pts);

    let tabela=document.getElementById("class-"+id);
    tabela.innerHTML=`<tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th></tr>`;

    lista.forEach((j,idx)=>{
      let classe=idx<4?"primeira":"segunda";
      let linha = idx===3?"linha":"";

      tabela.innerHTML+=`
      <tr class="${classe} ${linha}">
        <td>${idx+1}</td>
        <td>${j.nome}</td>
        <td>${j.pg}</td>
        <td>${j.pp}</td>
        <td>${j.pts}</td>
      </tr>`;
    });
  });
}

// 🔥 START
window.onload = () => {
  criar();
};

</script></body>
</html>
