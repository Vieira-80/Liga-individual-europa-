<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<title>Liga Individual Europa</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><style>
body {
  font-family: 'Segoe UI', Arial;
  background:#020617;
  color:white;
  padding:15px;
}

h1 { text-align:center; }

#adminBtn {
  position:fixed;
  top:10px;
  right:10px;
  background:transparent;
  border:none;
  color:#64748b;
  font-size:16px;
  opacity:0.6;
}

.card {
  background:#0f172a;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.jogo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#020617;
  padding:10px;
  border-radius:8px;
  margin-bottom:6px;
}

.jogador {
  width:40%;
  text-align:center;
  font-weight:bold;
}

input {
  width:45px;
  text-align:center;
  border-radius:6px;
  border:none;
  background:#1e293b;
  color:white;
  font-size:16px;
}

.vencedor { color:#22c55e; }
.derrotado { color:#ef4444; }

.tabela {
  margin-top:10px;
  background:#020617;
  border-radius:10px;
  padding:10px;
}

.tabela table {
  width:100%;
  border-collapse:collapse;
}

.tabela th {
  background:#0f172a;
  color:#94a3b8;
  font-weight:600;
}

.tabela th, .tabela td {
  padding:8px;
  text-align:center;
}

.top4 { background:#1e3a8a; }
.ultimos { background:#020617; }

.linha { border-bottom:2px solid #facc15; }

.legenda {
  margin-top:10px;
  font-size:13px;
  opacity:0.8;
  text-align:center;
}
</style></head><body><button id="adminBtn" onclick="login()">⚙️</button>

<h1>LIGA INDIVIDUAL EUROPA</h1><div id="app"></div><script>

const PASSWORD = "1234";
let editavel = false;

function login(){
  let tentativa = prompt("Código operador:");
  if(tentativa === PASSWORD){
    editavel = true;
    alert("Modo operador ativo");
    aplicarPermissoes();
  } else {
    alert("Código errado");
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyAjGPkHEc1-srjVvI8rhfhsTP-prs0jNUE",
  authDomain: "liga-individual-europa.firebaseapp.com",
  databaseURL: "https://liga-individual-europa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liga-individual-europa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grupos = {
  grupoA:["Maga","Gil","Monteiro","F. Carvalho","Rui","M. Alves","Diogo"],
  grupoB:["Carriço","Europa","Osório","Fábio","Bezelga","Igor","Sousa"],
  grupoC:["N. Vieira","Jorge António","Quim Zé","Cenário","Queirós","P. Jorge","Cristian"]
};

const jornadas = [
 [[2,1],[3,7],[4,6]],
 [[1,3],[7,4],[6,5]],
 [[4,1],[3,2],[5,7]],
 [[1,5],[2,4],[7,6]],
 [[6,1],[5,2],[4,3]],
 [[1,7],[2,6],[3,5]],
 [[7,2],[6,3],[5,4]]
];

let dadosGlobais = {};

function criar(){
  let html="";

  Object.keys(grupos).forEach(id=>{

    html+=`<div class="card"><h2>${id.toUpperCase()}</h2>`;

    jornadas.forEach((jornada,j)=>{
      html+=`<h3>Jornada ${j+1}</h3>`;

      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a = dadosGlobais[`${id}-${j}-${i}-1`] || "";
        let b = dadosGlobais[`${id}-${j}-${i}-2`] || "";

        let c1="", c2="";
        if(a!=="" && b!==""){
          if(Number(a)>Number(b)){ c1="vencedor"; c2="derrotado"; }
          else if(Number(b)>Number(a)){ c2="vencedor"; c1="derrotado"; }
        }

        html+=`
        <div class="jogo">
          <div class="jogador ${c1}">${p1}</div>
          <div>
            <input data-id="${id}-${j}-${i}-1" value="${a}">
            -
            <input data-id="${id}-${j}-${i}-2" value="${b}">
          </div>
          <div class="jogador ${c2}">${p2}</div>
        </div>`;
      });
    });

    html+=`<div class="tabela">
    <table id="class-${id}">
    <tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th></tr>
    </table>
    <div class="legenda">
      <p>* Azul = Top 4 (1ª categoria - Duplo KO)</p>
      <p>* Restantes = 2ª categoria</p>
    </div>
    </div></div>`;
  });

  document.getElementById("app").innerHTML=html;

  aplicarPermissoes();
  calcular();

  document.querySelectorAll("input").forEach(i=>{
    i.oninput = guardar;
  });
}

function guardar(){
  if(!editavel) return;

  document.querySelectorAll("input").forEach(i=>{
    dadosGlobais[i.dataset.id]=i.value;
  });

  db.ref("resultados").set(dadosGlobais);
}

db.ref("resultados").on("value", snap=>{
  dadosGlobais = snap.val() || {};
  criar();
});

function aplicarPermissoes(){
  document.querySelectorAll("input").forEach(i=>{
    i.disabled = !editavel;
  });
}

function calcular(){

  Object.keys(grupos).forEach(id=>{
    let stats={};

    grupos[id].forEach(j=>{
      stats[j]={pg:0,pp:0};
    });

    jornadas.forEach((jornada,j)=>{
      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a = Number(dadosGlobais[`${id}-${j}-${i}-1`]||0);
        let b = Number(dadosGlobais[`${id}-${j}-${i}-2`]||0);

        stats[p1].pg+=a;
        stats[p1].pp+=b;
        stats[p2].pg+=b;
        stats[p2].pp+=a;
      });
    });

    let lista=Object.keys(stats).map(n=>({
      nome:n,
      pg:stats[n].pg,
      pp:stats[n].pp,
      pts:stats[n].pg
    }));

    lista.sort((a,b)=>b.pts-a.pts);

    let t=document.getElementById("class-"+id);
    t.innerHTML="<tr><th>#</th><th>Jogador</th><th>PG</th><th>PP</th><th>Pts</th></tr>";

    lista.forEach((j,idx)=>{
      let c = idx<4?"top4":"ultimos";
      let l = idx===3?"linha":"";

      let medalha = idx<4 ? "🏆 " : "";

      t.innerHTML+=`
      <tr class="${c} ${l}">
        <td>${idx+1}</td>
        <td>${medalha}${j.nome}</td>
        <td>${j.pg}</td>
        <td>${j.pp}</td>
        <td>${j.pts}</td>
      </tr>`;
    });
  });
}

</script></body>
</html>
