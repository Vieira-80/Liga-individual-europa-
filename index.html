<!DOCTYPE html><html lang="pt">
<head>
<meta charset="UTF-8">
<title>Liga Individual Europa</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body {
  font-family: 'Segoe UI', Arial;
  background:#0f172a;
  color:white;
  padding:15px;
}

h1 { text-align:center; }

#adminBtn {
  position:fixed;
  top:10px;
  right:10px;
  background:transparent;
  border:none;
  color:#64748b;
  font-size:16px;
  opacity:0.6;
}

.card {
  background:#1e293b;
  border-radius:12px;
  padding:15px;
  margin-bottom:20px;
}

.jogo {
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0f172a;
  padding:10px;
  border-radius:8px;
  margin-bottom:6px;
}

.jogador {
  width:40%;
  text-align:center;
  font-weight:bold;
}

input {
  width:45px;
  text-align:center;
  border-radius:6px;
  border:none;
  background:#334155;
  color:white;
  font-size:16px;
}

.vencedor { color:#22c55e; }
.derrotado { color:#ef4444; }

.tabela {
  margin-top:10px;
  background:#0f172a;
  border-radius:10px;
  padding:10px;
}

.tabela table {
  width:100%;
  border-collapse:collapse;
}

.tabela th {
  background:#1e293b;
  color:#94a3b8;
  font-weight:600;
}

.tabela th, .tabela td {
  padding:8px;
  text-align:center;
}

.apurado { background:#1e3a8a; }
.melhor6 { background:#92400e; color:#fef3c7; font-weight:bold; }
.naoapurado { background:#0f172a; }

.linha { border-bottom:2px solid #facc15; }

.legenda {
  margin-top:10px;
  font-size:13px;
  opacity:0.8;
  text-align:center;
}
</style>
</head>

<body>
<button id="adminBtn" onclick="login()">⚙️</button>

<h1>LIGA INDIVIDUAL EUROPA</h1>
<div id="app"></div>

<script>
const PASSWORD = "1234";
let editavel = false;

function login(){
  let tentativa = prompt("Código operador:");
  if(tentativa === PASSWORD){
    editavel = true;
    alert("Modo operador ativo");
    aplicarPermissoes();
  } else {
    alert("Código errado");
  }
}

const firebaseConfig = {
  apiKey: "AIzaSyAjGPkHEc1-srjVvI8rhfhsTP-prs0jNUE",
  authDomain: "liga-individual-europa.firebaseapp.com",
  databaseURL: "https://liga-individual-europa-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "liga-individual-europa"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const grupos = {
  grupoA:["Maga","Gil","Monteiro","F. Carvalho","Rui","M. Alves","Diogo"],
  grupoB:["Carriço","Europa","Osório","Fábio","Bezelga","Igor","Sousa"],
  grupoC:["N. Vieira","Jorge António","Quim Zé","Cenário","Queirós","P. Jorge","Cristian"]
};

const jornadas = [
 [[2,1],[3,7],[4,6]],
 [[1,3],[7,4],[6,5]],
 [[4,1],[3,2],[5,7]],
 [[1,5],[2,4],[7,6]],
 [[6,1],[5,2],[4,3]],
 [[1,7],[2,6],[3,5]],
 [[7,2],[6,3],[5,4]]
];

let dadosGlobais = {};
let rankingsGlobais = {};
let melhorSextoGlobal = null;

function valorValido(v){
  return v !== undefined && v !== null && v !== "" && !Number.isNaN(Number(v));
}

function criar(){
  let html="";

  Object.keys(grupos).forEach(id=>{

    html+=`<div class="card"><h2>${id.toUpperCase()}</h2>`;

    jornadas.forEach((jornada,j)=>{
      html+=`<h3>Jornada ${j+1}</h3>`;

      jornada.forEach((jogo,i)=>{

        let p1=grupos[id][jogo[0]-1];
        let p2=grupos[id][jogo[1]-1];

        let a = dadosGlobais[`${id}-${j}-${i}-1`] || "";
        let b = dadosGlobais[`${id}-${j}-${i}-2`] || "";

        let c1="", c2="";
        if(valorValido(a) && valorValido(b)){
          if(Number(a)>Number(b)){ c1="vencedor"; c2="derrotado"; }
          else if(Number(b)>Number(a)){ c2="vencedor"; c1="derrotado"; }
        }

        html+=`
        <div class="jogo">
          <div class="jogador ${c1}">${p1}</div>
          <div>
            <input data-id="${id}-${j}-${i}-1" value="${a}">
            -
            <input data-id="${id}-${j}-${i}-2" value="${b}">
          </div>
          <div class="jogador ${c2}">${p2}</div>
        </div>`;
      });
    });

    html+=`<div class="tabela">
    <table id="class-${id}">
    <tr><th>#</th><th>Jogador</th><th>JG</th><th>PG</th><th>PP</th><th>DP</th><th>Pts</th></tr>
    </table>
    <div class="legenda">
      <p>* Azul = 5 primeiros apurados</p>
      <p>* Dourado = melhor 6.º lugar apurado</p>
    </div>
    </div></div>`;
  });

  document.getElementById("app").innerHTML=html;

  aplicarPermissoes();

  document.querySelectorAll("input").forEach(i=>{
    i.oninput = guardar;
  });

  calcular();
}

function guardar(){
  if(!editavel) return;

  document.querySelectorAll("input").forEach(i=>{
    dadosGlobais[i.dataset.id]=i.value;
  });

  db.ref("resultados").set(dadosGlobais);
}

db.ref("resultados").on("value", snap=>{
  dadosGlobais = snap.val() || {};
  criar();
});

function aplicarPermissoes(){
  document.querySelectorAll("input").forEach(i=>{
    i.disabled = !editavel;
  });
}

function calcularRankingGrupo(id){
  let stats={}, confrontos={};

  grupos[id].forEach(j=>{
    stats[j]={pg:0,pp:0,jg:0,diff:0};
    confrontos[j]={};
  });

  jornadas.forEach((jornada,j)=>{
    jornada.forEach((jogo,i)=>{

      let p1=grupos[id][jogo[0]-1];
      let p2=grupos[id][jogo[1]-1];

      let a = dadosGlobais[`${id}-${j}-${i}-1`];
      let b = dadosGlobais[`${id}-${j}-${i}-2`];

      if(valorValido(a) && valorValido(b)){

        let va = Number(a);
        let vb = Number(b);

        stats[p1].pg += va;
        stats[p1].pp += vb;
        stats[p2].pg += vb;
        stats[p2].pp += va;

        stats[p1].jg += 1;
        stats[p2].jg += 1;

        stats[p1].diff = stats[p1].pg - stats[p1].pp;
        stats[p2].diff = stats[p2].pg - stats[p2].pp;

        confrontos[p1][p2] = va - vb;
        confrontos[p2][p1] = vb - va;
      }

    });
  });

  let lista = grupos[id].map(j=>({
    grupo:id,
    nome:j,
    pg:stats[j].pg,
    pp:stats[j].pp,
    jg:stats[j].jg,
    pts:stats[j].pg,
    diff:stats[j].diff
  }));

  lista.sort((a,b)=>{
    if(b.pts !== a.pts) return b.pts - a.pts;

    let cd = confrontos[a.nome]?.[b.nome];
    if(cd !== undefined && cd !== 0){
      return -cd;
    }

    if(b.diff !== a.diff) return b.diff - a.diff;
    return b.pg - a.pg;
  });

  return lista;
}

function calcular(){

  rankingsGlobais = {};
  let sextos = [];

  Object.keys(grupos).forEach(id=>{
    let lista = calcularRankingGrupo(id);
    rankingsGlobais[id] = lista;

    if(lista[5]){
      sextos.push(lista[5]);
    }
  });

  sextos.sort((a,b)=>{
    if(b.pts !== a.pts) return b.pts - a.pts;
    if(b.diff !== a.diff) return b.diff - a.diff;
    if(b.pg !== a.pg) return b.pg - a.pg;
    if(a.pp !== b.pp) return a.pp - b.pp;
    return a.nome.localeCompare(b.nome);
  });

  melhorSextoGlobal = sextos[0] || null;

  Object.keys(grupos).forEach(id=>{
    let lista = rankingsGlobais[id];
    let t=document.getElementById("class-"+id);

    t.innerHTML="<tr><th>#</th><th>Jogador</th><th>JG</th><th>PG</th><th>PP</th><th>DP</th><th>Pts</th></tr>";

    lista.forEach((j,idx)=>{

      let melhor6 = melhorSextoGlobal &&
                    j.nome === melhorSextoGlobal.nome &&
                    j.grupo === melhorSextoGlobal.grupo &&
                    idx === 5;

      let c = idx<5 ? "apurado" : melhor6 ? "melhor6" : "naoapurado";
      let l = idx===4 ? "linha" : "";

      t.innerHTML+=`
      <tr class="${c} ${l}">
        <td>${idx+1}</td>
        <td>${j.nome}${melhor6 ? " ⭐" : ""}</td>
        <td>${j.jg}</td>
        <td>${j.pg}</td>
        <td>${j.pp}</td>
        <td>${j.diff}</td>
        <td>${j.pts}</td>
      </tr>`;
    });
  });
}
</script>
</body>
</html>
